aid: feezback
name: FeezBack
description: >-
  FeezBack is an Israeli open-banking fintech, founded in 2016, that builds the
  technological infrastructure and consumer products enabling financial players
  to compete in Israel's open-banking ecosystem. Its products cover account-to-
  account payment initiation (direct bank payments with no card-processing fees
  integrated into sales and point-of-sale flows), aggregated financial data for
  underwriting and risk assessment, and financial analysis for investment
  portfolio and risk allocation. FeezBack holds a Bank of Israel financial
  information service provider (AIS) license and a payment initiation (PIS)
  approval, and is ISO 27001 certified for information security. The company
  describes an API-based integration model for partners but publishes no public
  developer portal, API reference, or SDKs at this time.
